# Blueprint de Render: New → Blueprint → seleccionar este repositorio.
services:
  - type: web
    name: agente-reto-1
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3002"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-5.4-mini
      - key: LLM_EFFORT
        value: medium
      - key: MAX_ITERACIONES
        value: "25"
      - key: MAX_TOKENS_SESION
        value: "400000"
      - key: OPENAI_API_KEY
        sync: false
      - key: ACCESS_KEY
        sync: false
